set-option -g default-shell /bin/zsh
set-option -g update-environment "DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR"

set -s set-clipboard on

# vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# set vi-mode
set-window-option -g mode-keys vi

# vim visual mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# set true color
set -sa terminal-overrides ",xterm*:Tc"

# border adjustments
set -g pane-border-style "bg=default,fg=#1A1A1A"
set -g pane-active-border-style "bg=default,fg=#333333"
set -g pane-border-lines single

# toggle status bar
bind -n M-b set-option -g status

# sesh setup
bind-key "T" run-shell "sesh connect \"$(
  sesh list -tzT | fzf-tmux -p 55%,60% \
    --no-sort --border-label ' sesh ' --prompt ' > ' \
    --header ' ^a all | ^t tmx | ^x zox | ^d kill ' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt( all > )+reload(sesh list)' \
    --bind 'ctrl-t:change-prompt( tmx > )+reload(sesh list -t)' \
    --bind 'ctrl-x:change-prompt( zox > )+reload(sesh list -z)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {})+change-prompt( > )+reload(sesh list)' \
    --color 'bg:##030303,bg+:##4C4C4C,fg:##B8B8B8,fg+:##eeeeee,border:##4C4C4C,prompt:##D6D6D6,header:##888888,pointer:##eeeeee,label:##eeeeee'
)\""

# open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# clear screen bypass
bind -n M-l send-keys 'C-l'

# pane synchronization
bind-key e set-window-option synchronize-panes \; display-message "pane synchronization toggled"

# reorder tabs
bind-key -n C-Left swap-window -t -1 \; select-window -t -1
bind-key -n C-Right swap-window -t +1 \; select-window -t +1

# shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# shift alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# redimension panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# scratchpad terminal
bind -n M-g display-popup -d "#{pane_current_path}" -w 60% -h 60%

# toggle second brain popup
bind -n M-z if-shell -F '#{==:#{session_name},brain}' {
    detach-client
} {
    display-popup -d "~/second-brain" -w 80% -h 80% -E "tmux new-session -A -s brain 'nvim index.md'"
}

# cht.sh query
bind-key -r i run-shell "tmux neww ~/dotfiles/bin/cht.sh"

set-option -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100

# terminal adjustments
set -a terminal-features ',xterm*:sixel'
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# mouse mode
# set -g mouse on
# unbind -n MouseDrag1Pane
# unbind -Tcopy-mode MouseDrag1Pane

set -g extended-keys on

# set prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# plugin setup
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-resurrect & tmux-continuum
# set -g @resurrect-capture-pane-contents 'on'
# set -g @resurrect-strategy-nvim 'session'
# set -g @continuum-restore 'on'
# set -g @continuum-save-interval '15'
# set -g @continuum-boot 'on'

# theme setup
# set -g @plugin 'erikw/tmux-powerline'
# set -g status-style 'bg=default'
# set -g window-status-style bg=default
# set -g window-status-current-style bg=default

# native theme setup
set -g status-justify absolute-centre

set -g status-style "bg=default,fg=#888888"

set -g status-left-length 100
set -g status-left "#[fg=#c5c5c5,bold] #h #[fg=#444444] [#[fg=#cccccc,none]#S#[fg=#444444]] "

set -g status-right-length 100
set -g status-right "#[fg=#888888] #{s|$HOME|~|:pane_current_path} "

set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#c5c5c5,bold] [#I:#W] "
set -g window-status-separator ""

set -g message-style "bg=#222222,fg=#c5c5c5"
set -g message-command-style "bg=#222222,fg=#c5c5c5"

set-environment -g XDG_CONFIG_HOME "$HOME/.config"
run '~/.tmux/plugins/tpm/tpm'
